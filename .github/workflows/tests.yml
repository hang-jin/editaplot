name: public release checks

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  windows-python-312:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-runtime.lock

      - name: Install audited runtime and test tools
        run: >-
          python -m pip install
          --constraint requirements-runtime.lock
          --requirement requirements-runtime.txt
          pytest==9.1.1
          ruff==0.14.11

      - name: Lint public control surface
        run: >-
          python -m ruff check --no-cache
          skill/editaplot/scripts
          runtime/src/origin_sciplot/app.py
          runtime/src/origin_sciplot/event_raster.py
          runtime/src/origin_sciplot/event_raster_layout.py
          runtime/src/origin_sciplot/event_response.py
          runtime/src/origin_sciplot/scientific_context.py
          runtime/src/origin_sciplot/reference_figure.py
          runtime/src/origin_sciplot/flim_phasor.py
          runtime/src/origin_sciplot/research_grid.py
          runtime/src/origin_sciplot/spatial_profile.py
          runtime/src/origin_sciplot/ratiometric_response.py
          runtime/src/origin_sciplot/signal_stack.py
          runtime/src/origin_sciplot/signal_stack_layout.py
          runtime/src/origin_sciplot/spectral_density.py
          runtime/src/origin_sciplot/time_frequency.py
          runtime/src/origin_sciplot/circular_network_layout.py
          runtime/src/origin_sciplot/heatmap_layout.py
          runtime/src/origin_sciplot/scientific_visual.py
          runtime/src/origin_sciplot/main_window.py
          runtime/src/origin_sciplot/output_manager.py
          runtime/src/origin_sciplot/project_paths.py
          runtime/src/origin_sciplot/origin_backend/capabilities.py
          runtime/src/origin_sciplot/origin_backend/density_ridgeline3d_renderer.py
          runtime/src/origin_sciplot/origin_backend/execution_context.py
          runtime/src/origin_sciplot/origin_backend/flim_phasor_renderer.py
          runtime/src/origin_sciplot/origin_backend/heatmap_labels.py
          runtime/src/origin_sciplot/origin_backend/event_raster_renderer.py
          runtime/src/origin_sciplot/origin_backend/research_grid_renderer.py
          runtime/src/origin_sciplot/origin_backend/time_frequency_renderer.py
          runtime/src/origin_sciplot/origin_backend/signal_stack_renderer.py
          runtime/src/origin_sciplot/origin_backend/job_queue.py
          runtime/src/origin_sciplot/origin_backend/shap_dashboard_renderer.py
          runtime/src/origin_sciplot/shap_dashboard.py
          runtime/src/origin_sciplot/origin_backend/network_renderer.py
          runtime/src/origin_sciplot/origin_backend/safe_errors.py
          runtime/src/origin_sciplot/origin_backend/session.py
          runtime/src/origin_sciplot/origin_backend/smoke_test.py
          runtime/src/origin_sciplot/origin_backend/template_capabilities.py
          runtime/src/origin_sciplot/workers/origin_smoke_worker.py
          runtime/src/origin_sciplot/workers/run_template_worker.py
          runtime/templates/circular_network/runner.py
          runtime/templates/circular_network/service.py
          runtime/templates/density_ridgeline3d/runner.py
          runtime/templates/density_ridgeline3d/service.py
          runtime/templates/flim_phasor
          runtime/templates/time_frequency
          runtime/templates/signal_stack
          runtime/templates/event_raster
          runtime/templates/xps_adaptive/runner.py
          runtime/templates/xps_c1s_fit/runner.py
          tests
          tools/build_asset_provenance.py
          tools/build_palette_assets.py
          tools/build_runtime_manifest.py
          tools/build_showcase.py
          tools/build_star_trend.py
          tools/generate_showcase_data.py
          tools/generate_research_data.py
          tools/generate_shap_dashboard_data.py
          tools/sync_public_gallery.py
          tools/verify_public_release.py

      - name: Run reproducible tests
        shell: pwsh
        run: >-
          python -m pytest
          -p no:cacheprovider
          --basetemp "$env:RUNNER_TEMP\editaplot-pytest"
          -ra

      - name: Enforce public-release allowlist
        run: python tools/verify_public_release.py

  windows-python-newer:
    name: windows-python-${{ matrix.minor }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        minor: ["311"]
        include:
          - minor: "311"
            python-version: "3.11"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-runtime.lock

      - name: Install audited runtime and test tools
        run: >-
          python -m pip install
          --constraint requirements-runtime.lock
          --requirement requirements-runtime.txt
          pytest==9.1.1
          ruff==0.14.11

      - name: Run reproducible tests
        shell: pwsh
        run: >-
          python -m pytest
          -p no:cacheprovider
          --basetemp "$env:RUNNER_TEMP\editaplot-pytest"
          -ra

      - name: Enforce public-release allowlist
        run: python tools/verify_public_release.py
