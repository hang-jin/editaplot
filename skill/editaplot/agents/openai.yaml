interface:
  display_name: "EditaPlot"
  short_description: "丢入数据，自动选图并生成可编辑 Origin 科研图"
  default_prompt: "请使用 $editaplot 检查环境并只读分析我提供的数据，推荐合适图形；先让我确认一句科学目的，低置信度时再追加必要问题。确认后冻结方案，通过本机 Origin Automation 绘制并验证可编辑科研图。若仅因 Codex 沙箱上下文停止，请为同一条 origin-smoke 或 render 命令发起正式、受限的本地执行申请；只有精确申请获批后才重跑，人工确认或已配置的自动审查都可评估本次申请，但审批不保证通过。不要让我复制 PowerShell、使用管理员权限或修改 DCOM/注册表；其他连接失败只简要报告技术阶段和下一步。"
